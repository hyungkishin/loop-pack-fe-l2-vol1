name: Quality

'on':
  push:
    branches:
      - main
  pull_request:
  # 같은 조건에서 반복 측정하려고 연다. PR을 새로 만들지 않고 실행 시간을 잴 수 있다.
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치의 오래된 실행만 취소한다. group 에 ref 가 없으면 main push 까지 취소된다.
# cancel-in-progress 를 이벤트로 가르는 이유도 같다. PR 은 다음 push 가 답이지만
# main push 는 그 자체가 기록이라 중간에 끊으면 안 된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 배포 URL 증거가 아니라 build 계약을 검증하는 값이다.
    # 서버 metadata와 prefetch가 절대 URL을 만들려면 build 시점에 origin이 있어야 한다.
    # 이전 검증 체인 전체에 적용되던 값을 분리된 여덟 검증에도 동일하게 적용한다.
    # 설치 단계에서도 보이지만 해당 명령은 이 값을 사용하지 않는다.
    env:
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # PR의 base...head 경로를 직접 비교한다. 외부 changed-files 액션과
          # pull-requests: read 권한을 추가하지 않아도 된다.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright 설치를 둘로 나눈다. 이전에는 `install --with-deps` 하나라
      # apt 의존성과 브라우저 다운로드가 한 단계로 합쳐져 어느 쪽이 느린지 알 수 없었다.
      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium
      - name: Download Playwright Chromium
        run: pnpm exec playwright install chromium

      # 아래 여덟 개는 `pnpm check` 가 && 로 잇던 것과 같은 명령을 같은 순서로 실행한다.
      # 하나로 묶여 있으면 로그에 총 시간만 남아 어느 검증이 느린지 지목할 수 없다.
      - name: Architecture check
        run: pnpm architecture:check
      - name: Unit and DOM tests
        run: pnpm test
      - name: Storybook tests
        run: pnpm test:storybook
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test environment validation
        run: pnpm env:test
      - name: Validate environment
        run: pnpm env:check
      - name: Test bundle budget
        run: pnpm size:test
      - name: Build
        run: pnpm build
      - name: Check bundle budget
        run: pnpm size:check
      - name: Build Storybook
        run: pnpm build:storybook

      - name: Decide whether E2E is required
        id: e2e-changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "E2E: pull_request가 아니므로 실행" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            'src/**' \
            'public/**' \
            'e2e/**' \
            'scripts/**' \
            '.github/workflows/**' \
            'package.json' \
            'pnpm-lock.yaml' \
            'playwright.config.ts' \
            'next.config.ts' \
            'tsconfig.json' \
            'vitest.config.ts'; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "E2E: 문서 등 런타임과 무관한 변경만 있어 생략" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "E2E: 실행 경로 변경을 감지해 실행" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: E2E
        id: e2e
        if: steps.e2e-changes.outputs.run_e2e == 'true'
        run: pnpm test:e2e:prebuilt
      - name: Upload E2E failure artifacts
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 7
